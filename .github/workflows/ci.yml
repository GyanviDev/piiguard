name: CI

# Runs on every push and pull request to main. The point of a pipeline on a
# project like this is not ceremony: the redaction logic can regress silently —
# a broken detector still returns HTTP 200 — so the test suite is the only thing
# that reliably catches it, and it needs to run without anyone remembering to.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java:
    name: Java proxy — build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.m2 between runs; without it every build re-downloads the
          # whole dependency tree, which dominates the run time.
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      # Uploaded even when the build fails — that is exactly when the reports
      # are worth reading.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  python:
    name: ML classifier — train & smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python-service/requirements.txt

      - name: Install dependencies
        working-directory: python-service
        run: pip install -r requirements.txt

      # Training is the test. The script evaluates on a held-out split and runs
      # smoke assertions, so a model that stops generalising fails the build
      # rather than shipping quietly — which is what happened when a syntax
      # error here meant the classifier was silently absent in production.
      - name: Train model and run smoke tests
        working-directory: python-service
        run: python train_model.py

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: [java, python]

    steps:
      - uses: actions/checkout@v4

      # Proves the image still builds. Not pushed anywhere — this is a
      # correctness gate, not a release step.
      - name: Build proxy image
        run: docker build -t piiguard:ci .

      - name: Build classifier image
        run: docker build -t piiguard-ml:ci ./python-service
