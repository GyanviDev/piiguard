# Server port
server.port=8081

# OpenAI API Key (we'll add the real key before demo)
groq.api.key=API_KEY

# H2 Database (in-memory, resets on restart)
spring.datasource.url=jdbc:h2:mem:piiguarddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Show SQL in logs (useful for debugging)
spring.jpa.show-sql=true

# App name
spring.application.name=piiguard