# ══════════════════════════════════════════════════════════════════════════════
#  PII Guard — application configuration
#
#  Every secret is read from the environment with NO usable fallback. The previous
#  file defaulted the API key to the literal string "API_KEY", which meant a
#  deployment with the variable missing started successfully and then failed on
#  every request with an upstream 401 rendered to the user as if the model had
#  said it. Failing visibly beats failing subtly.
# ══════════════════════════════════════════════════════════════════════════════

spring.application.name=piiguard
server.port=${PORT:8081}

# Do not advertise the server implementation and version in response headers.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Cap the request body at the servlet layer. The DTO also enforces a prompt length,
# but that check runs only after Jackson has already parsed the whole body into
# memory — this one rejects an oversized payload before that work happens.
spring.servlet.multipart.max-request-size=256KB
server.tomcat.max-swallow-size=256KB
server.tomcat.max-http-form-post-size=256KB

# ── Upstream model ────────────────────────────────────────────────────────────
piiguard.llm.api-key=${GROQ_API_KEY:}
piiguard.llm.model=${LLM_MODEL:llama-3.3-70b-versatile}
piiguard.llm.base-url=${LLM_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
piiguard.llm.connect-timeout=5s
piiguard.llm.read-timeout=30s

# ── Admin API ─────────────────────────────────────────────────────────────────
# Blank disables /api/audit, /api/attack, /api/status and /actuator/** entirely.
# That is the safe default: a missing environment variable makes the operator
# endpoints unavailable rather than public.
piiguard.admin-api-key=${ADMIN_API_KEY:}

# ── Prompt limits ─────────────────────────────────────────────────────────────
piiguard.max-prompt-length=10000

# ── Token vault ───────────────────────────────────────────────────────────────
# The vault holds the only plaintext copy of the user's data. TTL is a privacy
# control, not a cache policy: it bounds how long a secret can survive a request
# that failed to clean up after itself.
piiguard.vault.ttl=5m
piiguard.vault.sweep-interval=1m
piiguard.vault.max-entries-per-session=500
piiguard.vault.max-sessions=10000
piiguard.vault.token-length=12

# ── Numeric perturbation ──────────────────────────────────────────────────────
# epsilon was 0.1 with a fixed sensitivity of 1.0, giving a noise scale of 10 on
# EVERY number in the prompt — dosages, years and quantities included. Noise is
# now proportional to magnitude and only applied above a floor.
piiguard.dp.enabled=true
piiguard.dp.epsilon=0.5
piiguard.dp.relative-sensitivity=0.02
piiguard.dp.absolute-sensitivity=1.0
piiguard.dp.min-magnitude=1000
piiguard.dp.session-budget=5.0

# ── Threat detection ──────────────────────────────────────────────────────────
piiguard.detection.ml-service-url=${ML_SERVICE_URL:http://localhost:8000}
piiguard.detection.ml-api-key=${ML_API_KEY:}
piiguard.detection.ml-confidence-threshold=0.75
piiguard.detection.ml-connect-timeout=2s
piiguard.detection.ml-read-timeout=3s
# Set to true where an unreachable classifier must block rather than degrade to
# the rule layer. Default false keeps the proxy usable when the sidecar restarts.
piiguard.detection.fail-closed=${DETECTION_FAIL_CLOSED:false}
piiguard.detection.circuit-breaker-threshold=3
piiguard.detection.circuit-breaker-reset-timeout=30s

# ── Rate limiting ─────────────────────────────────────────────────────────────
piiguard.rate-limit.enabled=true
piiguard.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:20}
piiguard.rate-limit.burst=10

# ── Audit ─────────────────────────────────────────────────────────────────────
# store-raw-prompt=false is the whole point. The previous implementation wrote the
# user's unredacted prompt to this table on every request, including blocked ones.
piiguard.audit.store-raw-prompt=${AUDIT_STORE_RAW:false}
piiguard.audit.hash-secret=${AUDIT_HASH_SECRET:}
piiguard.audit.retention=30d

# ── Database ──────────────────────────────────────────────────────────────────
# H2 file-backed rather than in-memory: an audit log that vanishes on restart is
# not an audit log. Point DB_URL at PostgreSQL for a real deployment.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/piiguard;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# The H2 web console is a full SQL client on the audit database. It stays off.
spring.h2.console.enabled=false

# ── Observability ─────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.diskspace.enabled=false

# ── Logging ───────────────────────────────────────────────────────────────────
# DEBUG on these packages must never print prompt content — log session ids and
# counts, never values. SQL logging stays off because parameter binding would
# print redacted prompts into the application log.
logging.level.com.piiguard=INFO
logging.level.org.hibernate.SQL=WARN
