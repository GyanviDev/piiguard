<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PII Guard — Enterprise Privacy Proxy</title>
<!--
  The Google Fonts <link> was removed deliberately. A privacy proxy that makes every
  visitor's browser announce itself to a third-party CDN — sending IP address, user agent
  and referring page — is undermined by its own landing page. A system font stack costs
  nothing, renders instantly, and lets the Content-Security-Policy forbid external origins
  outright instead of carving out an exception.

  All JavaScript moved to /js/app.js for the same reason: with no inline script, the CSP
  can set script-src 'self' with no 'unsafe-inline', which is what actually stops an
  injected <script> from executing.
-->
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <div class="shield"></div>
    PII Guard
  </div>
  <div class="topbar-divider"></div>
  <div class="status-pill">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">checking…</span>
  </div>
  <div class="topbar-tags" id="topbarTags"></div>
</div>

<div class="layout">

  <!-- LEFT TOP: input -->
  <div class="pane input-pane">
    <div class="pane-title">Prompt input</div>
    <textarea id="promptInput" placeholder="Enter a prompt containing sensitive data. The proxy redacts it before forwarding to the model.

Example: My name is Priya Sharma, email priya@acme.com, phone 9876543210. Our Q3 revenue was 4500000. Summarize this."></textarea>
    <div class="input-hint">
      <span>Ctrl + Enter to send</span>
      <label class="toggle">
        <input type="checkbox" id="noiseToggle" checked>
        <span>Perturb numeric values</span>
      </label>
    </div>
    <div class="btn-row">
      <button class="btn btn-send" id="sendBtn" type="button">
        <span class="spinner" id="spinner"></span>
        <span id="sendText">Send to proxy</span>
      </button>
      <button class="btn btn-attack" id="attackBtn" type="button">Run detection suite</button>
      <input class="admin-key" id="adminKey" type="password" placeholder="admin key (for suite)"
             autocomplete="off" spellcheck="false">
    </div>
  </div>

  <!-- RIGHT: response + suite -->
  <div class="pane response-pane">
    <div class="pane-title">Model response</div>
    <div class="response-output" id="llmResponse">Awaiting request…</div>

    <div id="warnings"></div>

    <div class="pane-title">Detection suite</div>
    <div class="attack-section">
      <div class="empty-state" id="attackEmpty">
        Runs every attack payload plus a set of benign control prompts that must
        <em>not</em> be blocked. Requires the admin key.
      </div>
      <div id="suiteSummary"></div>
      <div id="attackLog"></div>
    </div>

    <div class="meta-row" id="metaRow" hidden>
      <span>session</span>
      <span class="meta-val" id="sessionId">—</span>
    </div>
  </div>

  <!-- LEFT BOTTOM: diff -->
  <div class="pane diff-pane">
    <div class="pane-title">Redaction diff</div>
    <div class="diff-grid">
      <div class="diff-block">
        <div class="diff-label diff-label-before">Before — your text</div>
        <div class="diff-output" id="originalPrompt">—</div>
      </div>
      <div class="diff-block">
        <div class="diff-label diff-label-after">After — transmitted to the model</div>
        <div class="diff-output" id="sanitizedPrompt">—</div>
      </div>
    </div>
    <div class="redaction-summary" id="redactionSummary"></div>
  </div>

</div>

<script src="/js/app.js"></script>
</body>
</html>
