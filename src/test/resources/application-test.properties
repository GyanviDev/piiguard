# Test overrides. A profile-specific file rather than a replacement application.properties,
# so the real configuration still loads underneath and the tests exercise the production
# defaults for everything they do not deliberately change.

# In-memory, per-run database. The main configuration uses a file so audit records survive
# a restart; tests must not accumulate state across runs.
spring.datasource.url=jdbc:h2:mem:piiguard-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop

piiguard.admin-api-key=test-admin-key
piiguard.llm.api-key=test-llm-key
piiguard.audit.hash-secret=test-hash-secret

# Rate limiting is verified in its own focused test; leaving it on here would make every
# other test order-dependent and intermittently red.
piiguard.rate-limit.enabled=false

# Short timeouts so the ML classifier being absent (it is, in tests) fails fast.
piiguard.detection.ml-connect-timeout=200ms
piiguard.detection.ml-read-timeout=200ms

logging.level.com.piiguard=WARN
